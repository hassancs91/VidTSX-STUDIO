appId: com.learnwithhasan.vidtsx-studio
productName: VidTSX Studio
copyright: "Copyright (C) 2026 LearnWithHasan. All rights reserved."
directories:
  output: dist
  buildResources: resources
extraResources:
  - from: resources/binaries
    to: binaries
    filter:
      - "**/*"
      # sd-cli + its matched DLL set are downloaded in-app (Phase F install flow,
      # src/main/services/sdcli-install.ts) — never bundle dev drop-ins: a partial
      # or mixed-release DLL set fails to load (matched-set rule).
      - "!*.dll"
      - "!sd-cli.exe"
      - "!sd-server.exe"
  - from: resources/vendor
    to: vendor
    filter:
      - "**/*.js"
  - from: resources/skills
    to: skills
    filter:
      - "**/*"
      - "!**/.*"
  # Built-in caption packs (D13, PACKS_DESIGN.md). Ships as plain source: the
  # app transpiles a template on use, exactly like a project's TSX shots.
  - from: resources/caption-templates
    to: caption-templates
    filter:
      - "**/*"
      - "!**/.*"
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
asar: true
asarUnpack:
  # better-sqlite3 native binding (.node) must be outside ASAR so V8 can load it.
  - "node_modules/better-sqlite3/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"
  # esbuild native .exe — spawned by @remotion/bundler at Creator preview time.
  # Windows cannot spawn an .exe from inside ASAR, so unpack both the JS wrapper
  # and the platform binary subpackage.
  - "node_modules/esbuild/**"
  - "node_modules/@esbuild/**"
  # ── onnxruntime-node + @huggingface/transformers disabled in v0.1 — embedding
  # feature not exposed in the UI. Worker is only spawned on first loadModel() call.
  # When re-enabling embedding, uncomment the next line:
  # - "node_modules/onnxruntime-node/**"
  # ── sherpa-onnx (local STT/TTS) disabled in v0.1 — transcription/audio features
  # not shipping yet. When re-enabling, uncomment the lines for the platforms you ship:
  # - "node_modules/sherpa-onnx-node/**"
  # - "node_modules/sherpa-onnx-win-x64/**"
  # - "node_modules/sherpa-onnx-darwin-x64/**"     # only if shipping macOS
  # - "node_modules/sherpa-onnx-darwin-arm64/**"   # only if shipping macOS
  # - "node_modules/sherpa-onnx-linux-x64/**"      # only if shipping Linux
  # ── Local LLM (node-llama-cpp) disabled in v0.1 to keep installer small.
  # When the local-LLM feature ships, uncomment the next two lines:
  # - "node_modules/node-llama-cpp/**"
  # - "node_modules/@node-llama-cpp/**"
files:
  - out/**/*
  # ── Embedding (onnxruntime-node + @huggingface/transformers) disabled in v0.1.
  # IPC handlers in src/main/ipc/embedding-handlers.ts are still registered but nothing
  # in the UI calls them. Worker is lazy-spawned in src/embedding-engine/embedding-engine.ts.
  # When shipping embedding features:
  #   1. Remove the two "!" exclusions below.
  #   2. Uncomment "node_modules/onnxruntime-node/**" in asarUnpack above.
  - "!node_modules/onnxruntime-node/**/*"
  - "!node_modules/@huggingface/transformers/**/*"
  # ── sherpa-onnx (local STT/TTS) disabled in v0.1. Packages stay in node_modules for
  # dev (lazy-loaded via try/catch in src/audio-engine/audio-engine.ts:60-63, so the
  # app handles their absence gracefully). When shipping transcription/audio features:
  #   1. Remove the "!" exclusions below (at minimum sherpa-onnx-win-x64 for Windows).
  #   2. Uncomment the matching asarUnpack lines above.
  #   3. Add darwin/linux entries ONLY if shipping those platforms.
  - "!node_modules/sherpa-onnx-node/**/*"
  - "!node_modules/sherpa-onnx-win-x64/**/*"
  - "!node_modules/sherpa-onnx-darwin-x64/**/*"
  - "!node_modules/sherpa-onnx-darwin-arm64/**/*"
  - "!node_modules/sherpa-onnx-linux-x64/**/*"
  # ── Local LLM (node-llama-cpp) disabled in v0.1. Lazy-loaded in
  # src/llm-engine/llm-local-engine.ts. When shipping local LLM:
  #   1. Remove the two "!" exclusions below.
  #   2. Uncomment the matching asarUnpack lines above.
  #   3. Consider dropping unused GPU variants (cuda/vulkan) — full set adds ~965 MB.
  - "!node_modules/node-llama-cpp/**/*"
  - "!node_modules/@node-llama-cpp/**/*"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  extraResources:
    - from: resources/python/win-x64
      to: python
      filter:
        - "**/*"
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "VidTSX Studio"
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  license: LICENSE.txt
  artifactName: "VidTSX-Studio-Setup-${version}.${ext}"
  displayLanguageSelector: false
  menuCategory: false
  runAfterFinish: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  extraResources:
    - from: resources/python/darwin-${arch}
      to: python
      filter:
        - "**/*"
