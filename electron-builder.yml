appId: com.learnwithhasan.vidtsx-studio
productName: VidTSX Studio
copyright: "Copyright (C) 2026 LearnWithHasan. All rights reserved."
# Auto-update feed (docs/auto-update-plan.md). electron-builder writes latest.yml +
# a .blockmap next to the installer; electron-updater reads them from the release
# matching tag v${version}.
# releaseType: draft is the rollout safety valve — draft releases are INVISIBLE to
# the updater, so CI can upload, we smoke-test, and only "Publish" makes it live.
publish:
  provider: github
  owner: hassancs91
  repo: VidTSX-STUDIO
  releaseType: draft
# Double-clicking a project package opens the import dialog (Q7a). The path
# arrives on argv (Windows/Linux) or via 'open-file' (macOS); both funnel into
# src/main/services/studio/package-open.ts.
fileAssociations:
  - ext: vidtsx
    name: VidTSX project package
    description: VidTSX Studio project package
    role: Editor
  - ext: vidtsxagent
    name: VidTSX agent package
    description: VidTSX Studio agent package
    role: Editor
  - ext: vidtsxflow
    name: VidTSX flow package
    description: VidTSX Studio flow package
    role: Editor
  # Studio packs (TRANSITION_PACKS_DESIGN.md P5, FILTER_PACKS_DESIGN.md P5): a
  # pack of transitions and filters, a single transition, a single filter.
  - ext: vidtsxpack
    name: VidTSX pack
    description: VidTSX Studio pack (transitions and filters)
    role: Editor
  - ext: vidtsxtransition
    name: VidTSX transition
    description: VidTSX Studio transition
    role: Editor
  - ext: vidtsxfilter
    name: VidTSX filter
    description: VidTSX Studio filter
    role: Editor
directories:
  output: dist
  buildResources: resources
extraResources:
  - from: resources/binaries
    to: binaries
    filter:
      - "**/*"
      # sd-cli + its matched DLL set are downloaded in-app (Phase F install flow,
      # src/main/services/sdcli-install.ts) — never bundle dev drop-ins: a partial
      # or mixed-release DLL set fails to load (matched-set rule).
      - "!*.dll"
      - "!sd-cli.exe"
      - "!sd-server.exe"
  - from: resources/vendor
    to: vendor
    filter:
      - "**/*.js"
  - from: resources/skills
    to: skills
    filter:
      - "**/*"
      - "!**/.*"
  # Built-in editing presets (V1 completion plan §2.5) — copied into the
  # assets root on first use, never edited in place.
  - from: resources/presets
    to: presets
    filter:
      - "**/*"
      - "!**/.*"
  # Python worker scripts for the optional AI runtime (docs/ai-runtime-implementation-plan.md).
  # Source only (KB): the runtime itself (Python + torch, 334 MB / 2.6 GB) is downloaded on first
  # use from R2 through the download engine and never bundled. Replaces resources/python.
  - from: resources/pipelines
    to: pipelines
    filter:
      - "**/*"
      - "!**/__pycache__/**"
  # Built-in caption packs (D13, PACKS_DESIGN.md). Ships as plain source: the
  # app transpiles a template on use, exactly like a project's TSX shots.
  - from: resources/caption-templates
    to: caption-templates
    filter:
      - "**/*"
      - "!**/.*"
  # Built-in packs in the pack container (TRANSITION_PACKS_DESIGN.md) — the
  # core transitions today. Plain source, transpiled on use like caption templates.
  - from: resources/packs
    to: packs
    filter:
      - "**/*"
      - "!**/.*"
  # Built-in shot exemplars (SHOT_QUALITY_DESIGN.md Q3a). Plain source, read as
  # text and injected into the shot generation prompt — never executed.
  - from: resources/shot-exemplars
    to: shot-exemplars
    filter:
      - "**/*"
      - "!**/.*"
  # Built-in shot kit (SHOT_QUALITY_DESIGN.md Q4). Plain TSX source: bundled at
  # runtime by kit-bundler and served as the '@vidtsx/kit' virtual module;
  # copied beside shot copies (version-pinned) at export.
  - from: resources/shot-kit
    to: shot-kit
    filter:
      - "**/*"
      - "!**/.*"
  # Content Safety classifier (CONTENT_SAFETY_DESIGN.md D2d): bundled fp16 ONNX
  # + metadata. Deliberate exception to download-on-first-use — the fail-closed
  # gate must never have an absent state.
  - from: resources/content-safety
    to: content-safety
    filter:
      - "**/*"
  # Built-in agents (docs/agents-plan.md §1.5, §1.6): one folder per agent at
  # agents/<namespace>/<name>/, read-only. A user copy of the same id under
  # userData shadows one of these only when its version is HIGHER, so an app
  # update that ships a newer built-in takes over again on its own.
  - from: resources/agents
    to: agents
    filter:
      - "**/*"
      - "!**/.*"
  # Built-in flows (docs/flows-plan.md §1.7, W8 Stage 6): one folder per
  # flow, `<namespace>/<name>/flow.json`, read-only; a newer user copy of the
  # same id under userData shadows it, exactly as agents do.
  - from: resources/flows
    to: flows
    filter:
      - "**/*"
      - "!**/.*"
  # Built-in templates (docs/templates-plan.md §3): one folder per template,
  # `<namespace>/<name>/template.json` beside its composition and artwork,
  # read-only; shadowed by a newer user copy, as agents and flows are. They
  # preview and render from a working copy under userData, never from here.
  - from: resources/templates
    to: templates
    filter:
      - "**/*"
      - "!**/.*"
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
asar: true
asarUnpack:
  # better-sqlite3 native binding (.node) must be outside ASAR so V8 can load it.
  - "node_modules/better-sqlite3/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"
  # esbuild native .exe — spawned by @remotion/bundler at Creator preview time.
  # Windows cannot spawn an .exe from inside ASAR, so unpack both the JS wrapper
  # and the platform binary subpackage.
  - "node_modules/esbuild/**"
  - "node_modules/@esbuild/**"
  # onnxruntime-node native binding — required by the Content Safety worker
  # (src/content-safety-engine/worker.ts) and the analysis worker
  # (src/analysis-engine/worker.ts, DirectML first). Per-platform binaries;
  # the non-shipped platforms are excluded in `files` below.
  - "node_modules/onnxruntime-node/**"
  # ── sherpa-onnx (local STT/TTS) disabled in v0.1 — transcription/audio features
  # not shipping yet. When re-enabling, uncomment the lines for the platforms you ship:
  # - "node_modules/sherpa-onnx-node/**"
  # - "node_modules/sherpa-onnx-win-x64/**"
  # - "node_modules/sherpa-onnx-darwin-x64/**"     # only if shipping macOS
  # - "node_modules/sherpa-onnx-darwin-arm64/**"   # only if shipping macOS
  # - "node_modules/sherpa-onnx-linux-x64/**"      # only if shipping Linux
  # ── Local LLM (node-llama-cpp) disabled in v0.1 to keep installer small.
  # When the local-LLM feature ships, uncomment the next two lines:
  # - "node_modules/node-llama-cpp/**"
  # - "node_modules/@node-llama-cpp/**"
files:
  - out/**/*
  # ── onnxruntime-node ships for the Content Safety gate (NF9) — CPU execution
  # provider only (Rev 1 decision 1). Linux binaries never ship; the win/mac
  # cross-platform and DirectML exclusions live under win.files / mac.files.
  - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**/*"
  # ── @huggingface/transformers still excluded — embedding feature not exposed
  # in v0.1 (its worker only ever loads on an embedding loadModel() call, which
  # nothing in the UI issues). The Content Safety worker uses raw onnxruntime.
  - "!node_modules/@huggingface/transformers/**/*"
  # ── sherpa-onnx (local STT/TTS) disabled in v0.1. Packages stay in node_modules for
  # dev (lazy-loaded via try/catch in src/audio-engine/audio-engine.ts:60-63, so the
  # app handles their absence gracefully). When shipping transcription/audio features:
  #   1. Remove the "!" exclusions below (at minimum sherpa-onnx-win-x64 for Windows).
  #   2. Uncomment the matching asarUnpack lines above.
  #   3. Add darwin/linux entries ONLY if shipping those platforms.
  - "!node_modules/sherpa-onnx-node/**/*"
  - "!node_modules/sherpa-onnx-win-x64/**/*"
  - "!node_modules/sherpa-onnx-darwin-x64/**/*"
  - "!node_modules/sherpa-onnx-darwin-arm64/**/*"
  - "!node_modules/sherpa-onnx-linux-x64/**/*"
  # ── Local LLM (node-llama-cpp) disabled in v0.1. Lazy-loaded in
  # src/llm-engine/llm-local-engine.ts. When shipping local LLM:
  #   1. Remove the two "!" exclusions below.
  #   2. Uncomment the matching asarUnpack lines above.
  #   3. Consider dropping unused GPU variants (cuda/vulkan) — full set adds ~965 MB.
  - "!node_modules/node-llama-cpp/**/*"
  - "!node_modules/@node-llama-cpp/**/*"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  files:
    # ORT for win-x64: drop mac/arm binaries. The DirectML execution-provider
    # DLLs (+36 MB) SHIP since the analysis tracks (docs/studio/
    # FILTER_PACKS_DESIGN.md "Analysis tracks", 2026-09-24): DirectML is the
    # primary provider for face / matte analysis (MODNet 29 ms a frame vs
    # 263 ms on the CPU) with a CPU fallback recorded on the job. The Content
    # Safety gate still opens its session CPU-only (Rev 1 decision 1) — the
    # DLLs being present changes nothing for it.
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**/*"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**/*"
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  # Deliberately false: a per-user install lands in %LOCALAPPDATA%\Programs and
  # updates apply silently with no UAC prompt. Letting the user pick C:\Program Files
  # would make every silent update need elevation, which is the classic
  # "the update ran but nothing happened" bug. See docs/auto-update-plan.md §8.
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "VidTSX Studio"
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  license: LICENSE.txt
  artifactName: "VidTSX-Studio-Setup-${version}.${ext}"
  displayLanguageSelector: false
  menuCategory: false
  runAfterFinish: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  files:
    # CPU-only ORT for mac: win32 binaries never ship in the dmg.
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/**/*"
