<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidTSX Studio</title>
  <style>
    body {
      margin: 0;
      background: #1a1a1e;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a1e;
      z-index: 9999;
      gap: 24px;
    }
    #loading-screen .app-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: #c8b4ff;
      letter-spacing: 0.5px;
    }
    #loading-screen .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid #2a2a2e;
      border-top-color: #7F77DD;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="app-name">VidTSX Studio</div>
    <div class="spinner"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
